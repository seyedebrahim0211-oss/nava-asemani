name: ساخت اپ اندروید (APK)

on:
  push:
    branches: [main]
    paths-ignore:
      - "catalog/**"
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: ساخت و انتشار APK
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: بررسی سلامت کاتالوگ
        run: python3 scripts/validate_catalog.py

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: نصب Android SDK
        uses: android-actions/setup-android@v3

      - name: نصب پلتفرم اندروید ۳۵
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: آماده‌سازی Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: کلید امضای اختصاصی (اختیاری)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "NAVA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "کلید اختصاصی پیدا شد"
          else
            echo "کلید اختصاصی تنظیم نشده؛ از کلید مشترک داخل مخزن استفاده می‌شود"
          fi

      - name: ساخت APK
        env:
          NAVA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NAVA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NAVA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NAVA_CATALOG_URL: ${{ vars.NAVA_CATALOG_URL }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/NavaAsemani-1.0.${{ github.run_number }}.apk"

      - name: بارگذاری APK در Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NavaAsemani-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: آزمون‌های واحد
        run: ./gradlew --no-daemon :app:testReleaseUnitTest

      - name: انتشار در Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: نوای آسمانی ۱.۰.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          body: |
            ### نوای آسمانی — آرشیو زنده مداحی
            فایل APK را از بخش **Assets** پایین همین صفحه دانلود و روی گوشی (اندروید ۱۰ به بالا) نصب کنید.
            نسخه‌های بعدی را می‌توانید مستقیم روی همین نسخه نصب کنید؛ علاقه‌مندی‌ها و دانلودها حفظ می‌شوند.

  api-tests:
    name: آزمون سرور مدیریت
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt pytest httpx
      - run: python -m pytest -q server/tests
