name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Assemble Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK API 36
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;35.0.0' || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configure catalog URL (optional)
        env:
          NAVA_CATALOG_URL: ${{ vars.NAVA_CATALOG_URL }}
        run: |
          if [ -n "$NAVA_CATALOG_URL" ]; then
            printf "catalog.url=%s\n" "$NAVA_CATALOG_URL" > local.properties
          fi

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nava-asemani-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requirements
        run: pip install -r server/requirements.txt pytest httpx

      - name: Run API tests
        run: python -m pytest -q server/tests
