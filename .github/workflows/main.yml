name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Assemble Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configure catalog URL (optional)
        env:
          NAVA_CATALOG_URL: ${{ vars.NAVA_CATALOG_URL }}
        run: |
          if [ -n "$NAVA_CATALOG_URL" ]; then
            printf "catalog.url=%s\n" "$NAVA_CATALOG_URL" > local.properties
          fi

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nava-asemani-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requirements
        run: pip install -r server/requirements.txt pytest httpx

      - name: Run API tests
        run: python -m pytest -q server/tests

  release:
    name: Publish APK to Releases
    needs: [android, api-tests]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the tested APK
        uses: actions/download-artifact@v4
        with:
          name: nava-asemani-debug-apk
          path: release

      - name: Prepare APK asset
        run: |
          test -s release/app-debug.apk
          mv release/app-debug.apk "release/Nava-Asemani-v0.1-build-${{ github.run_number }}.apk"

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-build.${{ github.run_number }}
          name: Nava Asemani v0.1 - test build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            نسخه آزمایشی نوای آسمانی برای Android 10 و بالاتر.
            این فایل APK از شاخه main و بعد از موفقیت ساخت اندروید و تست‌های API ایجاد شده است.
            توجه: این نسخه Debug است و هنوز برای انتشار رسمی در فروشگاه‌ها امضا و آزمون نهایی نشده است.
            فایل APK را از بخش Assets این صفحه دانلود کنید.
          files: release/*.apk
